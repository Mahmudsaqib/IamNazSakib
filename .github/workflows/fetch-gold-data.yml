name: Fetch gold market data

# Runs only when dispatched manually or when the fetch pipeline itself changes.
# trigger: 2026-10-15T03:40Z
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-gold-data.yml"
      - "scripts/fetch_gold_data.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data clients
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pandas yfinance "git+https://github.com/rongardF/tvdatafeed.git" || \
          python -m pip install --quiet pandas yfinance

      - name: Fetch OHLCV (Yahoo GC=F / XAUUSD=X + TradingView OANDA:XAUUSD / COMEX:GC1!)
        continue-on-error: true
        run: python scripts/fetch_gold_data.py

      - name: Commit whatever was fetched (plus the fetch log) back to this branch
        run: |
          ls -la data/raw || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/raw
          git commit -m "data: gold OHLCV snapshot $(cat data/raw/fetched_at.txt 2>/dev/null || date -u +%FT%TZ)" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:${GITHUB_REF_NAME}
